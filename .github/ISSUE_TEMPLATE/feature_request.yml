name: Feature request
description: An idea for Still, a new companion, skill or plugin, or a change to an existing feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How Still could solve it. Mockups and examples welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Companions and hiring
        - Chat and the message box
        - Skills & plugins
        - Memory
        - Permissions and privacy
        - Browser and tabs
        - MCP and the command line
        - Mac
        - Something else
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself

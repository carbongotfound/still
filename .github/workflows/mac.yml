name: Mac

on:
  push:
    branches: [main]
    paths: ["mac/**", "still/Shell/**", "still/MainWindow.Actions.cs", "still/Still.csproj", ".github/workflows/mac.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sh mac/build.sh
      - name: Import test
        run: |
          mkdir -p /tmp/profile
          echo '{"roots":{"bookmark_bar":{"type":"folder","children":[{"type":"url","name":"Example","url":"https://example.com/"},{"type":"folder","children":[{"type":"url","name":"Wiki","url":"https://wikipedia.org/"}]}]}}}' > /tmp/profile/Bookmarks
          sqlite3 /tmp/profile/History "CREATE TABLE urls(id INTEGER PRIMARY KEY, url TEXT, title TEXT, last_visit_time INTEGER, hidden INTEGER DEFAULT 0); INSERT INTO urls(url, title, last_visit_time) VALUES ('https://example.com/', 'Example', 13400000000000000);"
          out=$(mac/build/Still.app/Contents/MacOS/Still --read-profile /tmp/profile)
          echo "$out"
          test "$out" = "2 1 2025-08-18T14:13:20Z"
      - name: Smoke test
        run: |
          mkdir -p ~/Library/Application\ Support/Still
          echo '{"Welcome":false,"ActiveId":"g","Tabs":[{"Id":"w","Title":"Wikipedia","Url":"https://en.wikipedia.org/wiki/Minimalism"},{"Id":"g","Title":"GitHub","Url":"https://github.com/carbongotfound/still"}]}' > ~/Library/Application\ Support/Still/state.json
          open "$PWD/mac/build/Still.app"
          sleep 12
          screencapture -x mac/build/smoke-start.png
          open -a "$PWD/mac/build/Still.app" https://en.wikipedia.org/wiki/Minimalism
          sleep 12
          screencapture -x mac/build/smoke.png
          pgrep -x Still
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Still-mac
          path: |
            mac/build/Still-mac.zip
            mac/build/smoke*.png
      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" mac/build/Still-mac.zip --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
